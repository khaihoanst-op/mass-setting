<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sách Lễ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@500&family=Be+Vietnam+Pro:wght@400;500&display=swap">
<style>
:root{--paper:#fbfafc;--ink:#1b1820;--muted:#6a6372;--violet:#4f2f7a;--rule:#ddd6e5}
@media (prefers-color-scheme:dark){:root{--paper:#141118;--ink:#ebe7f0;--muted:#a59db0;--violet:#c4a8ea;--rule:#332c3d;color-scheme:dark}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;padding:0 16px}
main{max-width:36rem;margin:0 auto;padding:3.5rem 0}
h1{font:500 2.2rem/1.2 "Noto Serif Display",Georgia,serif;color:var(--violet);margin:0 0 2rem;text-align:center}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule)}
a{display:flex;justify-content:space-between;gap:1rem;padding:.9rem 0;color:var(--ink);text-decoration:none}
a:hover b{color:var(--violet)}
b{font-weight:500}
span{color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>Sách Lễ</h1>
<ul>
  <!-- Mỗi thánh lễ mới: chép một dòng <li> và sửa đường dẫn, tên lễ, ngày -->
  <li><a href="2026-10-11-cau-hon/"><b>Lễ cầu cho tín hữu đã qua đời</b><span>11.10.2026</span></a></li>
</ul>
</main>
</body>
</html>
